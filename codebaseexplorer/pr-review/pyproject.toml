[project]
name = "bitbucket-mcp"
version = "0.1.0"
description = "Bitbucket PR review MCP server for Bizom KMM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bitbucket-mcp = "bitbucket_mcp.server:main"
pr-test-generator = "pr_test_generator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/bitbucket_mcp", "src/pr_test_generator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
